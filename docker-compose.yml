services:
  influxdb:
    image: influxdb:2
    container_name: optigrid_influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: pass1234
      DOCKER_INFLUXDB_INIT_ORG: OptiGrid
      DOCKER_INFLUXDB_INIT_BUCKET: EnergyData
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: token-1234
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data:
