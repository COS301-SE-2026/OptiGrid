services:
  redis:
    image: redis:7-alpine
    container_name: optigrid_redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./infrastructure/docker/.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: optigrid_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-pass1234}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-OptiGrid}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-EnergyData}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-dummy}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-api:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: uvicorn backend.ingestion.src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dummy}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  ingestion-worker:
      build: 
        context: .
        dockerfile: ./backend/ingestion/Dockerfile
      command: python -m backend.ingestion.src.queue_worker
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - INFLUXDB_URL=http://influxdb:8086
        - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-token-1234}
        - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
        - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
      volumes:
        - .:/app
      depends_on:
        redis:
          condition: service_healthy
        influxdb:
          condition: service_healthy

  seeder:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: python -m backend.ingestion.src.seeder
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dummy}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - .:/app
    depends_on:
      influxdb:
        condition: service_healthy

  emulator-worker:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: python -m backend.ingestion.src.sensor_emulator
    environment:
      - API_INGEST_URL=http://ingestion-api:8000/api/telemetry/ingest
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dummy}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
      ingestion-api:
        condition: service_started

volumes:
  influxdb_data:
  influxdb_config: