services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: optigrid_redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./infrastructure/docker/.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine@sha256:991673dc2d237bd79b15d6627410d72de111387e7dac673dbb92cf3333ffcc8c
    container_name: optigrid_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?INFLUXDB_INIT_PASSWORD hasto be set}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-OptiGrid}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-EnergyData}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN has to be set}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-api:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: uvicorn backend.ingestion.src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN has to be set}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-worker:
      build: 
        context: .
        dockerfile: ./backend/ingestion/Dockerfile
      command: python -m backend.ingestion.src.queue_worker
      deploy:
        resources:
          limits:
            memory: 256M
            cpus: "0.5"
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - INFLUXDB_URL=http://influxdb:8086
        - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN hasto be set}
        - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
        - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
      volumes:
        - .:/app
      depends_on:
        redis:
          condition: service_healthy
        influxdb:
          condition: service_healthy

  seeder:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: python -m backend.ingestion.src.seeder
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN has to be set}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - .:/app
    depends_on:
      influxdb:
        condition: service_healthy

  emulator-worker:
    build: 
      context: .
      dockerfile: ./backend/ingestion/Dockerfile
    command: python -m backend.ingestion.src.sensor_emulator
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      - API_INGEST_URL=http://ingestion-api:8000/api/telemetry/ingest
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN hasto be set}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-OptiGrid}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-EnergyData}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
      ingestion-api:
        condition: service_healthy

volumes:
  influxdb_data:
  influxdb_config:
