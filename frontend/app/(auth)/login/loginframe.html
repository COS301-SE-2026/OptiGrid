<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Optigrid | Login Wireframe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #EEF7FF;  
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        
        .login-card {
            width: 100%;
            max-width: 28rem; 
            background: #CDE8E5;  
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(77, 134, 156, 0.2), 0 1px 2px rgba(0, 0, 0, 0.02);
            padding: 1.5rem; 
            transition: all 0.2s ease;
        }

            .space-y-6 > * + * {
            margin-top: 1.5rem;
        }

        .space-y-4 > * + * {
            margin-top: 1rem;
        }

        
        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: #2C5A6E;  
            margin-bottom: 0;
        }

        
        .form-group {
            margin-bottom: 1rem;
        }

        
        .form-label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #2F5C6E;
            letter-spacing: -0.2px;
        }

       
        .text-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 400;
            background-color: #FFFFFF;
            border: 1.5px solid #BBD5D2;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            color: #1F4658;
            outline: none;
            line-height: 1.5;
        }

        .text-input:focus {
            border-color: #7AB2B2;
            box-shadow: 0 0 0 3px rgba(122, 178, 178, 0.25);
            outline: none;
        }

        .text-input::placeholder {
            color: #9DC1C0;
            font-weight: 400;
        }

    
       
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0 0.25rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #2F5C6E;
        }

        .checkbox-wrapper input {
            width: 1rem;
            height: 1rem;
            accent-color: #4D869C;
            cursor: pointer;
            margin: 0;
        }

       

        .forgot-link {
            color: #4D869C;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

      

        
        .login-btn {
            width: 100%;
            background: #4D869C;
            border: none;
            padding: 0.625rem 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.875rem;
            color: white;
            border-radius: 9999px; 
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1.5;
        }

     

    


        
        .signup-prompt {
            font-size: 0.875rem;
            color: #527A8C;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid #BFDDDA;
            margin-top: 1rem;
        }

        .signup-link {
            color: #4D869C;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }


        
        .palette-note {
            margin-top: 1rem;
            font-size: 0.7rem;
            text-align: center;
            color: #6D949F;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        
       
        
       
    </style>
</head>
<body>
    <div class="login-card">
        <div class="space-y-6">
           
            <div class="login-title">Login</div>

            
            <form id="loginForm" class="space-y-4">
               
                <div>
                    <label class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="text-input" 
                        placeholder="hello@gmail.com" 
                        autocomplete="email"
                        value=""
                    >
                </div>

               
                <div>
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="text-input" 
                        placeholder="··············" 
                        autocomplete="current-password"
                        value=""
                    >
                </div>

               
                <div id="errorContainer" class="error-message" style="display: none;"></div>
                <div id="successContainer" class="success-message" style="display: none;"></div>

               
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <span>Keep me signed in</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
                </div>

                
                <button type="submit" id="loginButton" class="login-btn">
                    Log into Optigrid 
                </button>
            </form>

            
            <div class="signup-prompt">
                Don't have an account? 
                <a href="#" id="signupLink" class="signup-link">signup</a>
            </div>

           
        </div>
    </div>


</body>
</html>
