name: Bottom-Up Integration Suite

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-foundation:
    name: Local Foundation Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run bottom-up local suite
        run: pnpm run test:bottom-up:local

  cloud-smoke:
    name: Cloud Smoke + Bootstrap Verification
    runs-on: ubuntu-latest
    needs: local-foundation
    if: github.event_name == 'workflow_dispatch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_allowed_ssh_cidr: ${{ secrets.TF_VAR_allowed_ssh_cidr }}
      TF_SMOKE_SSH_PRIVATE_KEY: ${{ secrets.TF_SMOKE_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate cloud smoke secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${AWS_REGION}"
          test -n "${TF_VAR_ssh_public_key}"
          test -n "${TF_SMOKE_SSH_PRIVATE_KEY}"

      - name: Write SSH key for bootstrap verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf "%s" "${TF_SMOKE_SSH_PRIVATE_KEY}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Write terraform.tfvars for smoke run
        shell: bash
        run: |
          set -euo pipefail
          cat > infrastructure/terraform/terraform.tfvars <<EOF
          ssh_public_key = "${TF_VAR_ssh_public_key}"
          allowed_ssh_cidr = "${TF_VAR_allowed_ssh_cidr:-0.0.0.0/0}"
          EOF

      - name: Apply, verify docker bootstrap, and always destroy
        shell: bash
        run: |
          set -euo pipefail
          TF_DIR="infrastructure/terraform"
          INSTANCE_TYPE="t2.micro"

          cleanup() {
            terraform -chdir="$TF_DIR" destroy -input=false -auto-approve -var "instance_type=${INSTANCE_TYPE}" || true
          }
          trap cleanup EXIT

          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" validate
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve -var "instance_type=${INSTANCE_TYPE}"
          HOST="$(terraform -chdir="$TF_DIR" output -raw server_public_ip)"

          SSH_KEY_PATH="$HOME/.ssh/id_ed25519" node scripts/verify-ec2-docker-bootstrap.mjs --host="$HOST"
