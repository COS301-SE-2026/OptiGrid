name: CI/CD Optigrid Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  frontend:
    name: Frontend 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Lint
        run: pnpm --filter @optigrid/frontend run lint

      - name: Unit Test
        run: pnpm --filter @optigrid/frontend run test

      - name: Build
        run: pnpm --filter @optigrid/frontend run build

  backend-core:
    name: Backend(Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: lint
        run: pnpm --filter @optigrid/core run lint

      - name: Unit Test
        run: pnpm --filter @optigrid/core run test

      - name: Build
        run: pnpm --filter @optigrid/core run build

  integration-foundation:
    name: Integration (Terraform + Auth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Start Supabase local emulator
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --yes
          fi
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor --ignore-health-check

      - name: Export Supabase local auth env vars
        run: |
          supabase status -o env > supabase.status.env
          echo "SUPABASE_URL=$(grep '^API_URL=' supabase.status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.status.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Run bottom-up local suite
        run: pnpm run test:bottom-up:local
