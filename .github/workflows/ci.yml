name: CI/CD Optigrid Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  frontend:
    name: Frontend 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @optigrid/frontend run build

      - name: Lint
        run: pnpm --filter @optigrid/frontend run lint

      - name: Test
        run: pnpm --filter @optigrid/frontend run test

  backend-core:
    name: Backend(Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm --filter @optigrid/core run build

      - name: lint
        run: pnpm --filter @optigrid/core run lint

      - name: test
        run: pnpm --filter @optigrid/core run test

      

