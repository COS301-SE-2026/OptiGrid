name: Deploy Containers

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - status
          - down
          - destroy
      ref:
        description: Branch, tag, or SHA to deploy
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-preview
    concurrency:
      group: aws-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve GHCR namespace
        id: ghcr
        shell: bash
        run: |
          namespace="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"

      - name: Copy production compose file to server
        if: inputs.action == 'deploy'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: infrastructure/docker/docker-compose.prod.yml
          target: ~/optigrid/
          overwrite: true

      - name: Configure .env and deploy via SSH
        if: inputs.action == 'deploy'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,GHCR_NAMESPACE,DATABASE_URL,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_KEY,INFLUXDB_URL,INFLUXDB_ORG,INFLUXDB_BUCKET
          script: |
            set -e
            mkdir -p ~/optigrid
            mv ~/optigrid/infrastructure/docker/docker-compose.prod.yml ~/optigrid/docker-compose.yml
            rm -rf ~/optigrid/infrastructure
            sed -i "s#ghcr.io/YOUR_GITHUB_USERNAME/#ghcr.io/${GHCR_NAMESPACE}/#g" ~/optigrid/docker-compose.yml

            existing_env_value() {
              if [ -f ~/optigrid/.env ]; then
                grep -m 1 "^$1=" ~/optigrid/.env | cut -d= -f2- || true
              fi
            }

            INFLUXDB_TOKEN="$(existing_env_value INFLUXDB_TOKEN)"
            if [ -z "${INFLUXDB_TOKEN}" ]; then
              INFLUXDB_TOKEN="$(openssl rand -hex 32)"
            fi

            INFLUXDB_INIT_PASSWORD="$(existing_env_value INFLUXDB_INIT_PASSWORD)"
            if [ -z "${INFLUXDB_INIT_PASSWORD}" ]; then
              INFLUXDB_INIT_PASSWORD="$(openssl rand -hex 24)"
            fi

            cat > ~/optigrid/.env <<EOF
            NODE_ENV=production
            FRONTEND_PORT=80
            CORE_PORT=4000
            INGESTION_PORT=8000
            ANALYTICS_PORT=8001
            DATABASE_URL=${DATABASE_URL}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            SUPABASE_KEY=${SUPABASE_KEY}
            INFLUXDB_URL=${INFLUXDB_URL}
            INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
            INFLUXDB_ORG=${INFLUXDB_ORG}
            INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
            INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
            EOF

            if [ -n "${GHCR_USERNAME}" ] && [ -n "${GHCR_TOKEN}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            cd ~/optigrid
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 10

            health_check_failed() {
              echo "Health checks failed. Showing docker compose status and recent logs..."
              docker compose ps
              docker compose logs --tail=100
              exit 1
            }

            check_worker_running() {
              SERVICE="$1"
              CONTAINER_ID="$(docker compose ps -q "$SERVICE")"
              if [ -z "$CONTAINER_ID" ]; then
                echo "Service $SERVICE does not have a container id."
                health_check_failed
              fi

              STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID")"
              RESTARTS="$(docker inspect --format='{{.RestartCount}}' "$CONTAINER_ID")"
              echo "$SERVICE status=$STATUS restarts=$RESTARTS"

              if [ "$STATUS" != "running" ]; then
                echo "Service $SERVICE is not running."
                health_check_failed
              fi

              if [ "$RESTARTS" -gt 0 ]; then
                echo "Service $SERVICE has restarted ($RESTARTS)."
                health_check_failed
              fi
            }

            echo "Checking frontend..."
            curl -fsS http://localhost:80/health || curl -fsS http://localhost:80/ || health_check_failed

            echo "Checking core..."
            curl -fsS http://localhost:4000/health || health_check_failed

            echo "Checking ingestion worker container..."
            check_worker_running ingestion

            echo "Checking analytics worker container..."
            check_worker_running analytics

            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_NAMESPACE: ${{ steps.ghcr.outputs.namespace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INFLUXDB_URL: ${{ vars.INFLUXDB_URL }}
          INFLUXDB_ORG: ${{ vars.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ vars.INFLUXDB_BUCKET }}

      - name: Run remote deployment control action
        if: inputs.action != 'deploy'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          envs: DEPLOY_ACTION
          script: |
            set -e
            if [ ! -d ~/optigrid ]; then
              echo "No ~/optigrid deployment directory found."
              exit 0
            fi

            cd ~/optigrid

            case "${DEPLOY_ACTION}" in
              status)
                docker compose ps
                ;;
              down)
                docker compose down --remove-orphans
                ;;
              destroy)
                docker compose down --volumes --remove-orphans
                docker image prune -af
                ;;
              *)
                echo "Unsupported deployment action: ${DEPLOY_ACTION}"
                exit 1
                ;;
            esac
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
