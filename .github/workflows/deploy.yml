name: Deploy Containers

on:
  workflow_run:
    workflows: ["Build, Scan, and Publish Images"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: infrastructure/docker/docker-compose.prod.yml
          target: ~/optigrid/
          overwrite: true

      - name: Configure .env and deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,INFLUXDB_URL,INFLUXDB_TOKEN,INFLUXDB_ORG,INFLUXDB_BUCKET
          script: |
            set -e
            mkdir -p ~/optigrid
            mv ~/optigrid/infrastructure/docker/docker-compose.prod.yml ~/optigrid/docker-compose.yml
            rm -rf ~/optigrid/infrastructure

            cat > ~/optigrid/.env <<EOF
            NODE_ENV=production
            FRONTEND_PORT=3000
            CORE_PORT=4000
            INGESTION_PORT=8000
            ANALYTICS_PORT=8001
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            INFLUXDB_URL=${INFLUXDB_URL}
            INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
            INFLUXDB_ORG=${INFLUXDB_ORG}
            INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
            EOF

            docker login ghcr.io -u "${GHCR_USERNAME}" -p "${GHCR_TOKEN}"
            cd ~/optigrid
            docker compose pull frontend core ingestion analytics
            docker compose up -d frontend core ingestion analytics
            sleep 10

            health_check_failed() {
              echo "Health checks failed. Showing docker compose status and recent logs..."
              docker compose ps
              docker compose logs --tail=100
              exit 1
            }

            echo "Checking frontend..."
            curl -fsS http://localhost:3000/health || curl -fsS http://localhost:3000/ || health_check_failed

            echo "Checking core..."
            curl -fsS http://localhost:4000/health || health_check_failed

            echo "Checking ingestion..."
            curl -fsS http://localhost:8000/health || health_check_failed

            echo "Checking analytics..."
            curl -fsS http://localhost:8001/health || health_check_failed

            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
