name: Deploy Containers

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - status
          - down
          - destroy
      ref:
        description: Branch, tag, or SHA to deploy
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: aws-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Copy production compose file to server
        if: inputs.action == 'deploy'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: infrastructure/docker/docker-compose.prod.yml
          target: ~/optigrid/
          overwrite: true

      - name: Configure .env and deploy via SSH
        if: inputs.action == 'deploy'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,INFLUXDB_URL,INFLUXDB_TOKEN,INFLUXDB_ORG,INFLUXDB_BUCKET
          script: |
            set -e
            mkdir -p ~/optigrid
            mv ~/optigrid/infrastructure/docker/docker-compose.prod.yml ~/optigrid/docker-compose.yml
            rm -rf ~/optigrid/infrastructure

            cat > ~/optigrid/.env <<EOF
            NODE_ENV=production
            FRONTEND_PORT=3000
            CORE_PORT=4000
            INGESTION_PORT=8000
            ANALYTICS_PORT=8001
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            INFLUXDB_URL=${INFLUXDB_URL}
            INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
            INFLUXDB_ORG=${INFLUXDB_ORG}
            INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
            EOF

            docker login ghcr.io -u "${GHCR_USERNAME}" -p "${GHCR_TOKEN}"
            cd ~/optigrid
            docker compose pull frontend core ingestion analytics
            docker compose up -d frontend core ingestion analytics
            sleep 10

            health_check_failed() {
              echo "Health checks failed. Showing docker compose status and recent logs..."
              docker compose ps
              docker compose logs --tail=100
              exit 1
            }

            check_worker_running() {
              SERVICE="$1"
              CONTAINER_ID="$(docker compose ps -q "$SERVICE")"
              if [ -z "$CONTAINER_ID" ]; then
                echo "Service $SERVICE does not have a container id."
                health_check_failed
              fi

              STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID")"
              RESTARTS="$(docker inspect --format='{{.RestartCount}}' "$CONTAINER_ID")"
              echo "$SERVICE status=$STATUS restarts=$RESTARTS"

              if [ "$STATUS" != "running" ]; then
                echo "Service $SERVICE is not running."
                health_check_failed
              fi

              if [ "$RESTARTS" -gt 0 ]; then
                echo "Service $SERVICE has restarted ($RESTARTS)."
                health_check_failed
              fi
            }

            echo "Checking frontend..."
            curl -fsS http://localhost:3000/health || curl -fsS http://localhost:3000/ || health_check_failed

            echo "Checking core..."
            curl -fsS http://localhost:4000/health || health_check_failed

            echo "Checking ingestion worker container..."
            check_worker_running ingestion

            echo "Checking analytics worker container..."
            check_worker_running analytics

            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}

      - name: Run remote deployment control action
        if: inputs.action != 'deploy'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          envs: DEPLOY_ACTION
          script: |
            set -e
            if [ ! -d ~/optigrid ]; then
              echo "No ~/optigrid deployment directory found."
              exit 0
            fi

            cd ~/optigrid

            case "${DEPLOY_ACTION}" in
              status)
                docker compose ps
                ;;
              down)
                docker compose down --remove-orphans
                ;;
              destroy)
                docker compose down --volumes --remove-orphans
                docker image prune -af
                ;;
              *)
                echo "Unsupported deployment action: ${DEPLOY_ACTION}"
                exit 1
                ;;
            esac
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
