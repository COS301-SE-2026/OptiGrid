name: AWS PR Preview

on:
  workflow_run:
    workflows: ["CI/CD Optigrid Pipeline"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    name: Queue AWS preview
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: aws-preview-server
      queue: max
      cancel-in-progress: false

    steps:
      - name: Check PR preview eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pr = run.pull_requests?.[0];

            if (!pr) {
              core.notice("Skipping AWS preview: CI run is not attached to a PR.");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            if (pull.base.ref !== "develop") {
              core.notice(`Skipping AWS preview: PR #${pr.number} targets ${pull.base.ref}, not develop.`);
              return;
            }

            if (pull.head.sha !== run.head_sha) {
              core.notice(`Skipping stale AWS preview: CI tested ${run.head_sha}, latest PR head is ${pull.head.sha}.`);
              return;
            }

            core.notice(`AWS preview queue acquired for PR #${pr.number} at ${run.head_sha}.`);

      - name: Preview placeholder
        run: |
          echo "AWS preview queue is wired."
          echo "Terraform/app deploy steps will be added in later commits."
