name: AWS PR Preview

on:
  workflow_run:
    workflows: ["CI/CD Optigrid Pipeline"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    name: Queue AWS preview
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: aws-preview
    concurrency:
      group: aws-preview-server
      queue: max
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
      SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

    steps:
      - name: Check PR preview eligibility
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pr = run.pull_requests?.[0];

            if (!pr) {
              core.notice("Skipping AWS preview: CI run is not attached to a PR.");
              core.setOutput("enabled", "false");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            if (pull.base.ref !== "develop") {
              core.notice(`Skipping AWS preview: PR #${pr.number} targets ${pull.base.ref}, not develop.`);
              core.setOutput("enabled", "false");
              return;
            }

            if (pull.head.sha !== run.head_sha) {
              core.notice(`Skipping stale AWS preview: CI tested ${run.head_sha}, latest PR head is ${pull.head.sha}.`);
              core.setOutput("enabled", "false");
              return;
            }

            core.setOutput("enabled", "true");
            core.setOutput("number", String(pr.number));
            core.setOutput("head_sha", run.head_sha);
            core.notice(`AWS preview queue acquired for PR #${pr.number} at ${run.head_sha}.`);

      - name: Check Terraform preview inputs
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        run: |
          missing=()

          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_REGION \
            TF_VAR_ssh_public_key \
            SERVER_SSH_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required preview inputs:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Setup Terraform preview variables
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.preview.outputs.number }}
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"

          {
            echo "TF_VAR_environment=pr-${PR_NUMBER}"
            echo "TF_VAR_instance_type=t3.medium"
            echo "TF_VAR_root_volume_size_gb=30"
            echo "TF_VAR_allowed_ssh_cidr=${runner_ip}/32"
          } >> "$GITHUB_ENV"

      - name: Checkout PR code
        if: steps.preview.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.head_sha }}

      - name: Setup Terraform
        if: steps.preview.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        if: steps.preview.outputs.enabled == 'true'
        id: tf_init
        working-directory: infrastructure/terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: steps.preview.outputs.enabled == 'true'
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Apply preview infrastructure
        if: steps.preview.outputs.enabled == 'true'
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve -input=false -no-color

      - name: Setup SSH key
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/optigrid-preview"
          chmod 600 "$HOME/.ssh/optigrid-preview"
          echo "SSH_KEY_PATH=$HOME/.ssh/optigrid-preview" >> "$GITHUB_ENV"

      - name: Capture server host
        if: steps.preview.outputs.enabled == 'true'
        id: tf_outputs
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          server_host="$(terraform output -raw server_public_ip)"
          echo "server_host=${server_host}" >> "$GITHUB_OUTPUT"

      - name: Check Docker on preview server
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          for attempt in $(seq 1 60); do
            if ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" \
              "cloud-init status --wait >/dev/null 2>&1 && sudo docker version >/dev/null 2>&1"; then
              echo "Preview server is reachable and Docker is ready."
              exit 0
            fi

            echo "Waiting for SSH, cloud-init, and Docker... attempt ${attempt}/60"
            sleep 10
          done

          echo "Preview server did not become ready in time."
          exit 1

      - name: Destroy preview infrastructure
        if: always() && steps.preview.outputs.enabled == 'true' && steps.tf_init.outcome == 'success'
        working-directory: infrastructure/terraform
        run: terraform destroy -auto-approve -input=false -no-color

      - name: Preview lifecycle complete
        if: steps.preview.outputs.enabled == 'true'
        run: |
          echo "AWS preview Terraform lifecycle completed."

      - name: Preview skipped
        if: steps.preview.outputs.enabled != 'true'
        run: |
          echo "AWS preview skipped for this CI run."
