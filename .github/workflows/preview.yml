name: AWS PR Preview

on:
  workflow_run:
    workflows: ["CI/CD Optigrid Pipeline"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    name: Queue AWS preview
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: aws-preview
    concurrency:
      group: aws-preview-server
      queue: max
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
      SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      INFLUXDB_URL: ${{ vars.INFLUXDB_URL }}
      INFLUXDB_ORG: ${{ vars.INFLUXDB_ORG }}
      INFLUXDB_BUCKET: ${{ vars.INFLUXDB_BUCKET }}

    steps:
      - name: Check PR preview eligibility
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pr = run.pull_requests?.[0];

            if (!pr) {
              core.notice("Skipping AWS preview: CI run is not attached to a PR.");
              core.setOutput("enabled", "false");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            if (pull.base.ref !== "develop") {
              core.notice(`Skipping AWS preview: PR #${pr.number} targets ${pull.base.ref}, not develop.`);
              core.setOutput("enabled", "false");
              return;
            }

            if (pull.head.sha !== run.head_sha) {
              core.notice(`Skipping stale AWS preview: CI tested ${run.head_sha}, latest PR head is ${pull.head.sha}.`);
              core.setOutput("enabled", "false");
              return;
            }

            core.setOutput("enabled", "true");
            core.setOutput("number", String(pr.number));
            core.setOutput("head_sha", run.head_sha);
            core.notice(`AWS preview queue acquired for PR #${pr.number} at ${run.head_sha}.`);

      - name: Check preview inputs
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        run: |
          missing=()

          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_REGION \
            TF_VAR_ssh_public_key \
            SERVER_SSH_PRIVATE_KEY \
            DATABASE_URL \
            SUPABASE_URL \
            SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_KEY \
            INFLUXDB_URL \
            INFLUXDB_ORG \
            INFLUXDB_BUCKET
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required preview inputs:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Setup Terraform preview variables
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.preview.outputs.number }}
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"

          {
            echo "TF_VAR_environment=pr-${PR_NUMBER}"
            echo "TF_VAR_instance_type=t3.medium"
            echo "TF_VAR_root_volume_size_gb=30"
            echo "TF_VAR_allowed_ssh_cidr=${runner_ip}/32"
          } >> "$GITHUB_ENV"

      - name: Setup preview app variables
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo "INFLUXDB_TOKEN=$(openssl rand -hex 32)"
            echo "INFLUXDB_INIT_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Checkout PR code
        if: steps.preview.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.head_sha }}

      - name: Setup Terraform
        if: steps.preview.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        if: steps.preview.outputs.enabled == 'true'
        id: tf_init
        working-directory: infrastructure/terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: steps.preview.outputs.enabled == 'true'
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Apply preview infrastructure
        if: steps.preview.outputs.enabled == 'true'
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve -input=false -no-color

      - name: Setup SSH key
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/optigrid-preview"
          chmod 600 "$HOME/.ssh/optigrid-preview"
          echo "SSH_KEY_PATH=$HOME/.ssh/optigrid-preview" >> "$GITHUB_ENV"

      - name: Capture server host
        if: steps.preview.outputs.enabled == 'true'
        id: tf_outputs
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          server_host="$(terraform output -raw server_public_ip)"
          echo "server_host=${server_host}" >> "$GITHUB_OUTPUT"

      - name: Check Docker on preview server
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          for attempt in $(seq 1 60); do
            if ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" \
              "cloud-init status --wait >/dev/null 2>&1 && sudo docker version >/dev/null 2>&1"; then
              echo "Preview server is reachable and Docker is ready."
              exit 0
            fi

            echo "Waiting for SSH, cloud-init, and Docker... attempt ${attempt}/60"
            sleep 10
          done

          echo "Preview server did not become ready in time."
          exit 1

      - name: Upload PR source to preview server
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" \
            "rm -rf ~/optigrid-preview && mkdir -p ~/optigrid-preview"

          git archive --format=tar HEAD \
            | gzip -1 \
            | ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" \
              "tar -xzf - -C ~/optigrid-preview"

      - name: Build preview images on server
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" <<'REMOTE'
          set -Eeuo pipefail

          cd ~/optigrid-preview

          sudo docker build -f frontend/Dockerfile -t optigrid-preview-frontend:latest .
          sudo docker build -f backend/core/Dockerfile -t optigrid-preview-core:latest .
          sudo docker build -f backend/ingestion/Dockerfile -t optigrid-preview-ingestion:latest .
          sudo docker build -f backend/analytics/Dockerfile -t optigrid-preview-analytics:latest .

          sudo docker image ls --filter 'reference=optigrid-preview-*'
          REMOTE

      - name: Configure preview app environment
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          preview_env="$(mktemp)"
          {
            printf '%s\n' "NODE_ENV=production"
            printf '%s\n' "FRONTEND_PORT=80"
            printf '%s\n' "CORE_PORT=4000"
            printf '%s\n' "INGESTION_PORT=8000"
            printf '%s=%s\n' "DATABASE_URL" "$DATABASE_URL"
            printf '%s=%s\n' "SUPABASE_URL" "$SUPABASE_URL"
            printf '%s=%s\n' "SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
            printf '%s=%s\n' "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            printf '%s=%s\n' "SUPABASE_KEY" "$SUPABASE_KEY"
            printf '%s=%s\n' "INFLUXDB_URL" "$INFLUXDB_URL"
            printf '%s=%s\n' "INFLUXDB_TOKEN" "$INFLUXDB_TOKEN"
            printf '%s=%s\n' "INFLUXDB_ORG" "$INFLUXDB_ORG"
            printf '%s=%s\n' "INFLUXDB_BUCKET" "$INFLUXDB_BUCKET"
            printf '%s=%s\n' "INFLUXDB_INIT_PASSWORD" "$INFLUXDB_INIT_PASSWORD"
          } > "$preview_env"

          scp "${ssh_opts[@]}" "$preview_env" "ubuntu@${SERVER_HOST}:~/optigrid-preview/.env.preview"

      - name: Run preview compose smoke test
        if: steps.preview.outputs.enabled == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" <<'REMOTE'
          set -Eeuo pipefail

          cd ~/optigrid-preview

          cp infrastructure/docker/docker-compose.prod.yml docker-compose.preview.yml
          sed -i 's#ghcr.io/YOUR_GITHUB_USERNAME/optigrid-#optigrid-preview-#g' docker-compose.preview.yml

          compose() {
            sudo docker compose -p optigrid-preview -f docker-compose.preview.yml --env-file .env.preview "$@"
          }

          wait_for_http() {
            name="$1"
            url="$2"

            for attempt in $(seq 1 60); do
              if curl -fsSL "$url" >/dev/null 2>&1; then
                echo "$name responded at $url"
                return 0
              fi

              echo "Waiting for $name... attempt ${attempt}/60"
              sleep 5
            done

            echo "$name did not respond at $url"
            return 1
          }

          check_service_running() {
            service="$1"
            container_id="$(compose ps -q "$service")"

            if [ -z "$container_id" ]; then
              echo "Service $service does not have a container id."
              return 1
            fi

            status="$(sudo docker inspect --format='{{.State.Status}}' "$container_id")"
            echo "$service status=$status"
            [ "$status" = "running" ]
          }

          compose up -d --remove-orphans
          wait_for_http "frontend" "http://127.0.0.1:80/health"
          wait_for_http "core" "http://127.0.0.1:4000/health"
          check_service_running ingestion
          check_service_running analytics
          compose ps
          REMOTE

      - name: Stop preview compose stack
        if: always() && steps.preview.outputs.enabled == 'true' && steps.tf_outputs.outputs.server_host != ''
        continue-on-error: true
        shell: bash
        env:
          SERVER_HOST: ${{ steps.tf_outputs.outputs.server_host }}
        run: |
          ssh_opts=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
          )

          ssh "${ssh_opts[@]}" "ubuntu@${SERVER_HOST}" <<'REMOTE'
          set -Eeuo pipefail

          cd ~/optigrid-preview

          if [ -f docker-compose.preview.yml ]; then
            sudo docker compose -p optigrid-preview -f docker-compose.preview.yml --env-file .env.preview down --volumes --remove-orphans
          fi
          REMOTE

      - name: Destroy preview infrastructure
        if: always() && steps.preview.outputs.enabled == 'true' && steps.tf_init.outcome == 'success'
        working-directory: infrastructure/terraform
        run: terraform destroy -auto-approve -input=false -no-color

      - name: Preview lifecycle complete
        if: steps.preview.outputs.enabled == 'true'
        run: |
          echo "AWS preview Compose smoke test completed."

      - name: Preview skipped
        if: steps.preview.outputs.enabled != 'true'
        run: |
          echo "AWS preview skipped for this CI run."
