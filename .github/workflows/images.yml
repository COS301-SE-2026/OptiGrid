name: Build and Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image_name: optigrid-frontend
            dockerfile: ./frontend/Dockerfile
          - service: core
            image_name: optigrid-core
            dockerfile: ./backend/core/Dockerfile
          - service: ingestion
            image_name: optigrid-ingestion
            dockerfile: ./backend/ingestion/Dockerfile
          - service: analytics
            image_name: optigrid-analytics
            dockerfile: ./backend/analytics/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}"
          SHA_TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          # Build context stays at repo root because Dockerfiles copy shared workspace files.
          docker buildx build \
            --load \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            .

      - name: Push image tags
        run: |
          docker push "${{ steps.meta.outputs.latest_tag }}"
          docker push "${{ steps.meta.outputs.sha_tag }}"
